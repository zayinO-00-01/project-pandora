<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>潘多拉 · 水墨入场</title>
<style>
:root{color-scheme:light;--paper:#f3efe5;--ink:#19313a;--muted:#566a70}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:system-ui,'Microsoft YaHei',sans-serif}body{overflow-x:hidden}.painting{position:fixed;inset:0;pointer-events:none}.painting img,.painting video{position:absolute;width:100%;height:100%;object-fit:fill}.painting video{opacity:0}.painting.ready video{opacity:1}header{position:fixed;z-index:3;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:20px 24px;gap:12px}header strong{font-family:serif;font-size:21px;font-weight:500}button,a{color:var(--ink);background:rgba(243,239,229,.96);border:0;border-radius:4px;padding:14px 18px;text-decoration:none;font-size:14px;cursor:pointer;min-height:48px}a:focus-visible,button:focus-visible{outline:2px solid #17655f;outline-offset:3px}main{height:300svh}.caption{position:fixed;z-index:2;inset:auto 24px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:15px 18px;background:rgba(243,239,229,.94);border-radius:4px;font-size:13px}.caption span:last-child{color:var(--muted)}#arrival{position:fixed;z-index:3;bottom:24px;left:24px;right:24px;display:none;background:#aa4929;color:#faf7ef;justify-content:center;text-align:center;font-size:16px}body.final .caption{display:none}body.final #arrival{display:flex}dialog{border:1px solid #c3d0d0;border-radius:10px;background:var(--paper);color:var(--ink);padding:28px;width:min(90vw,420px)}dialog::backdrop{background:#19313a55}dialog h2{margin:0 0 12px;font-size:22px}dialog p{font-size:14px;line-height:1.8}.qa{display:none}@media(min-width:700px){header,.caption{max-width:700px;margin:auto}#arrival{max-width:652px;margin:auto}}
</style>
<div class="painting" aria-hidden="true"><img src="initial.png" alt=""><video id="film" muted playsinline preload="auto" poster="initial.png" src="ink-journey-60.mp4"></video></div>
<header><strong>潘多拉</strong><button id="skip">直接登录</button></header>
<main aria-label="水墨入场，向下滚动浏览三段过渡"></main>
<div class="caption"><span id="stage">风起 · 入画</span><span>向下滚动 ↓</span></div><button id="arrival">进入登录</button>
<dialog id="entry"><h2>进入登录</h2><p>这是落地页视觉验证预览。安装包中的此入口打开已有登录表单。</p><button id="close">返回画面</button></dialog>
<script>
const video=document.querySelector('#film'),painting=document.querySelector('.painting'),reduce=matchMedia('(prefers-reduced-motion: reduce)');
let target=0,seeking=false,manual=false,failed=false;
function seek(){if(manual||video.readyState<2||seeking||reduce.matches||failed)return;if(Math.abs(video.currentTime-target)<.005)return;seeking=true;video.currentTime=target}
video.addEventListener('seeked',()=>{seeking=false;seek()});video.addEventListener('loadeddata',()=>{if(!reduce.matches)painting.classList.add('ready');seek()});video.addEventListener('error',()=>{failed=true;painting.classList.remove('ready')});
function scrollFrame(){if(manual)return;const p=Math.min(1,Math.max(0,scrollY/(document.documentElement.scrollHeight-innerHeight)));target=Math.round(p*540)/60;document.querySelector('#stage').textContent=p<1/3?'风起 · 入画':p<2/3?'山隐 · 墨生':'水阔 · 留白';document.body.classList.toggle('final',p>=.92);seek()}
addEventListener('scroll',()=>requestAnimationFrame(scrollFrame),{passive:true});addEventListener('resize',scrollFrame);reduce.addEventListener('change',()=>{painting.classList.toggle('ready',!reduce.matches&&!failed);scrollFrame()});
const entry=document.querySelector('#entry');document.querySelectorAll('#skip,#arrival').forEach(b=>b.onclick=()=>entry.showModal());document.querySelector('#close').onclick=()=>entry.close();
window.inkScan={state:'idle'};
window.scanFrames=async()=>{
 manual=true;window.inkScan={state:'running',checked:0};
 const canvas=document.createElement('canvas');canvas.width=180;canvas.height=320;const ctx=canvas.getContext('2d',{willReadFrequently:true}),hashes=new Set(),records=[];
 try{
 for(let n=0;n<=540;n++){
   const wanted=n/60+0.00001;
   let actual=null;
   await new Promise((resolve,reject)=>{
     const timer=setTimeout(()=>reject(Error('frame seek timeout '+n)),5000);
     const done=()=>{clearTimeout(timer);resolve()};
     if(video.requestVideoFrameCallback)video.requestVideoFrameCallback((now,m)=>{actual=m.mediaTime;done()});else video.addEventListener('seeked',done,{once:true});
     video.currentTime=wanted;
   });
   if(actual!==null && Math.abs(actual-n/60)>.009)throw Error('decoded frame mismatch '+n+' '+actual);
   ctx.drawImage(video,0,0,180,320);const pixels=ctx.getImageData(0,0,180,320).data;let hash=2166136261,sum=0;
   for(let k=0;k<pixels.length;k+=32){hash=Math.imul(hash^pixels[k],16777619);sum+=pixels[k]}
   const mean=sum/(pixels.length/32);if(mean<20)throw Error('black frame '+n);
   hashes.add(hash>>>0);records.push({frame:n,actual,hash:hash>>>0,mean});window.inkScan.checked=n+1;
 }
 const seamCanvas=document.createElement('canvas');seamCanvas.width=540;seamCanvas.height=960;const sc=seamCanvas.getContext('2d',{willReadFrequently:true});
 async function pixels(url){const im=new Image();im.src=url;await im.decode();sc.drawImage(im,0,0,540,960);return sc.getImageData(0,0,540,960).data}
 for(let n=1;n<=2;n++){const a=await pixels(`ink-transition-${n}-last.png`),b=await pixels(`ink-transition-${n+1}-first.png`);if(a.some((v,k)=>v!==b[k]))throw Error('seam mismatch '+n)}
 if(hashes.size<400)throw Error('insufficient distinct frames '+hashes.size);
 window.inkFrameRecords=records;window.inkScan={state:'passed',checked:541,distinctFrames:hashes.size,fps:60,seamsIdentical:true,decodedTimestampsVerified:true};
 }catch(e){window.inkScan={...window.inkScan,state:'failed',error:e.message}}finally{manual=false;scrollFrame()}
};
scrollFrame();
</script></html>
