schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project Pandora：Android + Web + 一个 Spring Boot API。
  技术栈：Java 17、Spring Boot 3、本地H2（另留MySQL配置），业务时区 Asia/Shanghai、Flyway、JWT + BCrypt。
  Android：Kotlin、Jetpack Compose，最低 Android 8，包名 com.projectpandora.app。
  Web：Vue 3、Vite。
  API 前缀：/api/v1。支持本地一键演示，客户端服务地址可配置，不要硬编码服务IP。
  CI 测试不得使用云端数据库。
  一期基线：main 2fa2104，Android 0.10.25 (88)，Flyway 到 V29。
  FOUNDER、DEPT_HEAD、TEAM_LEAD、STAFF 使用 Android；ADMIN 使用 Web 维护账号、组织和公司事项。
  业务权限按实际直属上级关系及业务规则判定；任务创建和变更按对应的直属上级审批规则执行。
  二期 CRM 不属于一期已实现能力。

