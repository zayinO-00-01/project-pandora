schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
context: |
  Project Pandora：Android + Web + 一个 Spring Boot API。
  技术栈：Java 17、Spring Boot 3、本地H2（另留MySQL配置），业务时区 Asia/Shanghai、Flyway、JWT + BCrypt。
  Android：Kotlin、Jetpack Compose，最低 Android 8，包名 com.projectpandora.app。
  Web：Vue 3、Vite。
  API 前缀：/api/v1。当前本地一键演示，云部署暂缓，不要硬编码服务IP。
  CI 测试不得使用云端数据库。
  一期排除：AI 地图、MBTI、跨公司匹配、分层审批、图表。
  本分支后端基于 zayin，角色为 ADMIN、LEADER、STAFF。
  安卓设计按 main 2026-10-09 文档接受 STAFF、TEAM_LEAD、DEPT_HEAD、FOUNDER，并兼容旧 LEADER；ADMIN 仅 Web。

