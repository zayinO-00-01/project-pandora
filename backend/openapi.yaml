openapi: 3.0.3
info:
  title: Pandora API
  version: 0.7.0
  description: 五角色本地原型。Web仅ADMIN账号管理；Android四业务角色。公开注册关闭；支持任务审核、品牌标签、应用内通知和个人账号设置。
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /auth/login:
    post:
      summary: 登录，停用账号拒绝
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
  /admin/users:
    get:
      summary: 仅 ADMIN：账号列表
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
    post:
      summary: 仅 ADMIN：建号
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 用户名trim后唯一；上级必须为启用的更高业务角色。ADMIN/FOUNDER无上级。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
  /admin/users/{id}:
    patch:
      summary: 仅 ADMIN：修改账号、角色、组织与停用
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 防止层级错误和组织环。相关角色/上级/停用变化撤销pending/approved查看申请；重新启用不恢复授权。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUser"
  /users:
    get:
      summary: 业务账号可读成员，含本人
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: FOUNDER全公司启用业务成员；部门/团队领导实际下级树；STAFF仅本人。ADMIN403。
  /users/organization:
    get:
      summary: 业务组织与可派发责任人
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: members为可读成员且不含本人；manager为直属上级；assignees仅实际较低角色下级。FOUNDER全公司可读不代表均可派发。
  /logs:
    get:
      summary: 本人及授权目标日志
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 默认本人；历史不限日期。他人仅submitted，含获批直属上级只读。ADMIN403。
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
        - in: query
          name: date
          schema:
            type: string
            format: date
    post:
      summary: 新建草稿/提交日志
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 起止日期均须在上海today-3..today内，共用一份正文，可保存草稿；非法范围400。作者来自当前身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInput"
  /logs/{id}:
    put:
      summary: 作者编辑日志
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 创建后24小时内作者可修改，否则403；日期范围不能改变，非法变动400。已提交不可回草稿，保持同ID。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInput"
  /logs/{id}/submit:
    post:
      summary: 作者提交原草稿
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 旧记录超出窗口403；重复提交保持同ID。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
  /logs/integrity:
    get:
      summary: 历史占位接口，无真实完整性校验
      deprecated: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integrity"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
  /view-requests:
    get:
      summary: 本人发起或收到的申请
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
    post:
      summary: 申请查看直属上级
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 仅当前更高业务角色直属上级，理由非空；已有pending/approved返回409。拒绝或撤销后可重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRequestInput"
  /view-requests/{id}:
    put:
      summary: 被查看者批准、拒绝或撤销
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: pending→approved/denied；approved→revoked。批准只可读目标submitted日志及其负责的任务，不含草稿或写入派发权。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewDecision"
  /tasks:
    get:
      summary: 授权范围任务
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 返回本人创建、本人负责及已有权限内的任务，含已完成；未生效创建仅申请人和审核人可见。指定userId须有成员读权限，且仅返回其已生效任务。ADMIN403。
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
    post:
      summary: 业务成员创建任务并选择任意公司成员
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 所有业务成员可选择公司内有效业务成员，包括自己；创始人直接生效，其余由直属上级审核。无有效上级返回409，不创建半成品。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
  /tasks/{id}/progress:
    put:
      summary: 仅责任人反馈进度
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 非创始人提交直属上级审核，批准后更新。创始人直接生效。独立保存status(todo/doing/done)，progress选填可null；填值时todo仅0、doing为0..99、done仅100。说明非空最多2000字。旧请求仅缺status且有整数progress时兼容推导。查看批准不授予反馈权限。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskProgress"
  /panels/map:
    get:
      summary: 业务首页四板块
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelMap"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 本人今日日志、当前可读最新10任务；两个十大事板块暂空。ADMIN403。
  /tasks/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    put:
      summary: 创建人或创始人编辑任务
      description: 创始人直接生效；其他创建人由直属上级审核；同一任务同时只能有一个待审核变更。拒绝或撤回后可以重新编辑。
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskInput'}
      responses:
        '200': {description: 返回当前生效内容；非创始人的新内容保存到审核记录}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
    delete:
      summary: 仅创始人可删除，直接生效
      description: 软删除任务；取消待审申请，保留审核历史并通知相关成员。
      security: [{bearer: []}]
      responses:
        '200': {description: 任务已删除}
        '403': {$ref: '#/components/responses/Error403'}
  /task-reviews:
    get:
      summary: 本人提交或需本人审批的任务变更
      security: [{bearer: []}]
      responses:
        '200': {description: 按提交时间倒序，包含操作、拟议内容、审批人、状态和时间}
  /task-reviews/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    put:
      summary: 直属上级批准或拒绝；申请人可撤回
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: {type: string, enum: [approved, rejected, canceled]}
      responses:
        '200': {description: 处理后的审核记录}
        '403': {$ref: '#/components/responses/Error403'}
        '409': {$ref: '#/components/responses/Error409'}
  /labels:
    get:
      summary: 所有业务成员可读取启用标签
      security: [{bearer: []}]
      responses:
        '200': {description: 标签数组，含 id、name、color、active}
    post:
      summary: 创始人新增标签
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LabelInput'}
      responses:
        '200': {description: 已创建标签}
        '403': {$ref: '#/components/responses/Error403'}
  /labels/{id}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    put:
      summary: 创始人更新标签名称及颜色，关联任务和日历同步反映
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LabelInput'}
      responses:
        '200': {description: 已更新标签}
    delete:
      summary: 创始人停用标签；历史关联保留
      security: [{bearer: []}]
      responses:
        '200': {description: 已停用}
  /notifications:
    get:
      summary: 当前账号的应用内通知
      security: [{bearer: []}]
      responses:
        '200': {description: 按时间倒序，含 id、title、message、type、referenceId、createdAt、readAt}
  /notifications/{id}/read:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    put:
      summary: 将自己的通知标为已读
      security: [{bearer: []}]
      responses:
        '200': {description: 更新后的通知}
        '403': {$ref: '#/components/responses/Error403'}
  /profile:
    get:
      summary: 读取自己的资料及头像
      security: [{bearer: []}]
      responses:
        '200': {description: 含 id、username、displayName、role、avatarData}
  /profile/avatar:
    put:
      summary: 上传自己的头像或清空头像
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [avatarData]
              properties:
                avatarData: {type: string, maxLength: 60000, description: 'PNG/JPEG data URL；解码后最大45KB、1024×1024；空串移除'}
      responses:
        '200': {description: 已更新的本人资料}
  /profile/password:
    put:
      summary: 验证当前密码后修改自己的密码
      description: 新密码8至72字符，且UTF-8最多72字节；成功后旧会话全部失效。
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: {type: string, maxLength: 72}
                newPassword: {type: string, minLength: 8, maxLength: 72}
      responses:
        '200': {description: 修改成功，客户端重新登录}
  /tasks/{id}/keywords:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
    post:
      summary: 任务创建人及执行人共同添加关键词
      description: 仅已生效任务，每任务最多12个词，每词1至24字，不允许重复或控制字符。有待审变更时先处理审核。
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskKeywordInput'}
      responses:
        '200': {description: 关键词已添加}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
  /tasks/{id}/keywords/{keywordId}:
    parameters:
      - {in: path, name: id, required: true, schema: {type: integer, format: int64}}
      - {in: path, name: keywordId, required: true, schema: {type: integer, format: int64}}
    put:
      summary: 修改关键词，修改他人词需直属上级审核
      description: 自己添加的词直接修改；创始人免审。其他修改保留原词直至直属上级批准，复用任务审核及通知。响应message说明是否已提交审核。
      security: [{bearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskKeywordInput'}
      responses:
        '200': {description: 已更新或已提交直属上级审核}
        '400': {$ref: '#/components/responses/Error400'}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
    delete:
      summary: 删除关键词，删除他人词需直属上级审核
      security: [{bearer: []}]
      responses:
        '200': {description: 已删除或已提交直属上级审核，批准前保留原词}
        '403': {$ref: '#/components/responses/Error403'}
        '404': {$ref: '#/components/responses/Error404'}
        '409': {$ref: '#/components/responses/Error409'}
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TaskKeywordInput:
      type: object
      required: [text]
      properties:
        text: {type: string, minLength: 1, maxLength: 24}
    TaskKeyword:
      type: object
      properties:
        id: {type: integer, format: int64}
        text: {type: string, maxLength: 24}
        createdBy: {type: integer, format: int64}
    LabelInput:
      type: object
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 64}
        color: {type: string, pattern: '^#[0-9a-fA-F]{6}$'}
    WorkLabel:
      allOf:
        - {$ref: '#/components/schemas/LabelInput'}
        - type: object
          properties:
            id: {type: integer, format: int64}
            active: {type: boolean}
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
      required:
        - username
        - password
        - role
    PatchUser:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        clearManager:
          type: boolean
          description: true clears current managerId
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    Session:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          nullable: true
    LogInput:
      type: object
      properties:
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 选择标签ID；0清空；更新省略或null保留原标签
        logDate:
          type: string
          format: date
          description: Creation uses Asia/Shanghai today-3..today; edits allowed within 24 hours after createdAt; date range is immutable.
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
      required:
        - logDate
        - content
    WorkLog:
      type: object
      properties:
        label:
          allOf:
            - {$ref: '#/components/schemas/WorkLabel'}
          nullable: true
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        logDate:
          type: string
          format: date
          description: Creation uses Asia/Shanghai today-3..today; edits allowed within 24 hours after createdAt; date range is immutable.
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Organization:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        manager:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
    ViewRequestInput:
      type: object
      properties:
        targetId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - targetId
        - reason
    ViewDecision:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - denied
            - revoked
      required:
        - status
    ViewRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requester:
          $ref: "#/components/schemas/UserSummary"
        target:
          $ref: "#/components/schemas/UserSummary"
        reason:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - revoked
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      properties:
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 选择标签ID；0清空；更新省略或null保留原标签
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ""
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
      required:
        - title
        - assigneeId
    Task:
      type: object
      properties:
        keywords:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/TaskKeyword'}
        label:
          allOf:
            - {$ref: '#/components/schemas/WorkLabel'}
          nullable: true
        approvalStatus:
          type: string
          enum: [approved, pending, rejected]
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ""
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - todo
            - doing
            - done
        progress:
          type: integer
          nullable: true
          description: 未填写时为null，不能显示为0%。
          minimum: 0
          maximum: 100
        progressNote:
          type: string
        createdBy:
          type: integer
          format: int64
        creatorName:
          type: string
        assigneeName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskProgress:
      type: object
      description: 新客户端必须明确status；progress可省略或null，不把未知进度当成0。旧客户端仅提交整数progress仍临时兼容。
      properties:
        status:
          type: string
          enum: [todo, doing, done]
          description: 独立工作状态；与所填百分比不一致时返回400，不更改原记录。
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 选填严格整数；todo仅0，doing为0..99，done仅100；字符串和小数拒绝。
        progressNote:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - progressNote
      anyOf:
        - required: [status]
        - required: [progress]
          properties:
            progress:
              type: integer
              nullable: false
              minimum: 0
              maximum: 100
    PanelItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        sortOrder:
          type: integer
        myRemark:
          type: string
          nullable: true
    PanelMap:
      type: object
      properties:
        companyImportant:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
        companyDispatch:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
          maxItems: 10
        personalTop:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
        todayLogs:
          type: array
          items:
            $ref: "#/components/schemas/WorkLog"
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    Integrity:
      type: object
      properties:
        ok:
          type: boolean
        supportsDateRanges:
          type: boolean
          description: True when the server supports inclusive endDate on work logs.
        message:
          type: string
  responses:
    Error400:
      description: 参数错误（含重复用户名）；无效新建/目标日期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: 未登录或账号停用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: 角色/范围无权，或原日志已超出编辑窗口
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: 记录不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: 申请重复、状态已变化或并发冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
