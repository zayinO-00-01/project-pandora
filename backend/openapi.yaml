                  $ref: '#/components/schemas/KeywordReview'
      description: PROGRESS、KEYWORD_EDIT、KEYWORD_DELETE。审核权随申请人的当前有效直属上级变化。初审仍走/tasks/pending-approvals，定义变更/删除审核走/tasks/reviews。
