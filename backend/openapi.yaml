openapi: 3.0.3
info:
  title: Pandora API
  version: 0.2.0
  description: 本地日志演示契约。登录、成员范围与日志接口已实现；面板只有今日日志有真实数据，tasks 仅规划未实现。
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: 注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                displayName: { type: string }
      responses:
        "201":
          description: 已创建
        "400":
          description: 用户名已存在或字段不合法
  /auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [ADMIN, LEADER, STAFF] }
                  displayName: { type: string }
                  userId: { type: integer }
        "401":
          description: 口令错误
  /logs/integrity:
    get:
      summary: 完整性校验历史占位（尚未校验实际完整性）
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "401":
          description: 未登录
  /logs:
    get:
      summary: 本人可看含草稿的日志；LEADER 只看直属下属、ADMIN 看全部成员的已提交日志
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: userId
          schema: { type: integer }
      responses:
        "200":
          description: 按时间倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkLog" }
        "403":
          description: 无权查看该用户
    post:
      summary: 新建日志，省略 status 默认 submitted
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logDate, content]
              properties:
                logDate: { type: string, format: date, description: 不能晚于今天 }
                content: { type: string, minLength: 1, maxLength: 5000 }
                status: { type: string, enum: [draft, submitted], default: submitted }
      responses:
        "201":
          description: 已保存，返回服务端分配的 ID 和时间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "400":
          description: 日期晚于今天、正文为空/超过5000字或状态不合法
  /health:
    get:
      summary: 无需登录的健康检查
      responses:
        "200": { description: 服务正常 }
  /users:
    get:
      summary: 本人及授权成员的公开资料，不含密码
      security: [{ bearer: [] }]
      responses:
        "200":
          description: STAFF 仅本人，LEADER 本人及直属下属，ADMIN 全部
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "401": { description: 未登录 }
  /logs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    put:
      summary: 作者修改日志；已提交不能改回草稿
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogInput" }
      responses:
        "200":
          description: 修改后的同一篇日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "400": { description: 参数错误或尝试撤回已提交状态 }
        "401": { description: 未登录 }
        "403": { description: 不是日志作者 }
        "404": { description: 日志不存在 }
  /logs/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: 作者提交草稿；重复提交不重复创建，无需 body
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 已提交日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "401": { description: 未登录 }
        "403": { description: 不是日志作者 }
        "404": { description: 日志不存在 }
  /panels/map:
    get:
      summary: 导图四板块
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 当前公司事项、派发及个人待办为空；仅 todayLogs 返回本人今日日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyImportant:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  companyDispatch:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  personalTop:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  todayLogs:
                    type: array
                    items: { $ref: "#/components/schemas/WorkLog" }
  /tasks:
    get:
      summary: 我相关的任务（规划，尚未实现）
      x-implemented: false
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: source
          schema: { type: string, enum: [dispatch, invite] }
      responses:
        "200":
          description: 列表
    post:
      summary: 派发或邀约（规划，尚未实现）
      x-implemented: false
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Task" }
      responses:
        "201":
          description: 已创建
        "403":
          description: 员工不能派发公司任务
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    LogInput:
      type: object
      required: [logDate, content]
      properties:
        logDate: { type: string, format: date, description: 不能晚于今天 }
        content: { type: string, minLength: 1, maxLength: 5000, description: 不能全部为空白 }
        status: { type: string, enum: [draft, submitted], description: PUT 省略时保留原状态 }
    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, LEADER, STAFF] }
    WorkLog:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        logDate: { type: string, format: date }
        content: { type: string }
        status: { type: string, enum: [draft, submitted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PanelItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        sortOrder: { type: integer }
        myRemark: { type: string, description: 只影响当前用户 }
    Task:
      type: object
      required: [title, priority, assigneeId, source]
      properties:
        title: { type: string }
        detail: { type: string }
        priority: { type: string }
        dueAt: { type: string, format: date-time }
        progress: { type: integer, minimum: 0, maximum: 100 }
        progressNote: { type: string }
        assigneeId: { type: integer }
        relatedUserIds:
          type: array
          items: { type: integer }
        source: { type: string, enum: [dispatch, invite] }
        status: { type: string, enum: [todo, doing, done] }
