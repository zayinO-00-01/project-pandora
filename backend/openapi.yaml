openapi: 3.0.3
info:
  title: Pandora API
  version: 0.8.1
  description: 老师方案整合版：保留用户自建审批、年月直选和清单同步；全公司业务成员选人，非创始人创建与进度提交由当前直属上级审批；创始人本人操作免审。删除暂按创建人条件直删/上级审核。日志按创建后24小时修改，任务日历与日志分离。
servers:
- url: /api/v1
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /auth/login:
    post:
      summary: 登录，停用账号拒绝
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /admin/users:
    get:
      summary: 仅 ADMIN：账号列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
    post:
      summary: 仅 ADMIN：建号
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 用户名trim后唯一；上级必须为启用的更高业务角色。ADMIN/FOUNDER无上级。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
  /admin/users/{id}:
    patch:
      summary: 仅 ADMIN：修改账号、角色、组织与停用
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 防止层级错误和组织环。相关角色/上级/停用变化撤销pending/approved查看申请；重新启用不恢复授权。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUser'
  /users:
    get:
      summary: 业务账号可读成员，含本人
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: FOUNDER全公司启用业务成员；部门/团队领导实际下级树；STAFF仅本人。ADMIN403。
  /users/organization:
    get:
      summary: 业务组织与可派发责任人
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: members为可读成员且不含本人；manager为直属上级；assignees仅实际较低角色下级。FOUNDER全公司可读不代表均可派发。
  /logs:
    get:
      summary: 本人及授权目标日志
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 默认本人；历史不限日期。他人仅submitted，含获批直属上级只读。ADMIN403。
      parameters:
      - in: query
        name: userId
        schema:
          type: integer
          format: int64
      - in: query
        name: date
        schema:
          type: string
          format: date
    post:
      summary: 新建草稿/提交日志
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 上海今天及前三天可创建单日/连续多日日志，起止日期均须在范围内；draft保持私密，submitted可供授权上级查看。创建后24小时内允许作者编辑或提交。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
  /logs/{id}:
    put:
      summary: 作者编辑日志
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅作者可在createdAt≤当前时间<createdAt+24小时内修改（含历史/跨日和已提交日志）。日期范围固定，updatedAt不延长窗口；submitted不能退回draft，超时403。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
  /logs/{id}/submit:
    post:
      summary: 作者提交原草稿
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅作者在创建后24小时内可提交，适用于历史和跨日草稿；提交不延长编辑窗口。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
  /logs/integrity:
    get:
      summary: 日志能力探测
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrity'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: supportsDateRanges用于客户端能力协商。完整性校验文案仍为占位返回，不代表已实现额外业务校验。
  /view-requests:
    get:
      summary: 本人发起或收到的申请
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
    post:
      summary: 申请查看直属上级
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅当前更高业务角色直属上级，理由非空；已有pending/approved返回409。拒绝或撤销后可重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewRequestInput'
  /view-requests/{id}:
    put:
      summary: 被查看者批准、拒绝或撤销
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: pending→approved/denied；approved→revoked。批准只可读目标submitted日志及其负责的任务，不含草稿或写入派发权。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewDecision'
  /tasks:
    get:
      summary: 授权范围任务
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 默认角色读范围，包含pending/rejected自主任务；指定userId读取其负责的任务（须有成员读权限）。FOUNDER全公司，部门/团队领导实际下级树，员工本人；ADMIN403。
      parameters:
      - in: query
        name: userId
        schema:
          type: integer
          format: int64
    post:
      summary: 创建自主任务或向实际下级派发
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 所有业务成员可选全公司有效业务成员为责任人，包括自己；非创始人创建均待创建者当前有效直属上级批准，创始人直接生效。待批准只对创建者和有效审核人可见；不扩大日志权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
  /tasks/pending-approvals:
    get:
      summary: 待本人审批的任务创建申请（含自建与派发）
      description: 仅返回当前直属上级为登录用户、作者启用且职级低于审批人的pending自主任务。组织调整后由新的直属上级审批，原上级失去审批权；ADMIN403。
      security:
      - bearer: []
      responses:
        '200':
          description: 待审批任务，按创建时间和ID倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /tasks/{id}/approval:
    put:
      summary: 当前直属上级审批自主任务
      description: 由创建者当前有效直属上级批准或拒绝；非创始人创建均需初审。组织变更后原上级失权，当前有效上级可审批。
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApproval'
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/{id}/progress:
    put:
      summary: 仅责任人反馈进度
      responses:
        '200':
          description: 返回当前生效任务；非创始人申请的拟议内容在/task-reviews读取。审批通过后刷新任务。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅责任人提交。非创始人提交todo/doing/done均生成PROGRESS审核，当前有效直属上级批准前保持旧状态与说明；仅创始人本人作为责任人操作直接生效。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskProgress'
  /panels/map:
    get:
      summary: 业务首页四板块
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelMap'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 本人今日日志、当前可读最新10任务、已发布公司事项及本人十大事项；详情和本人备注随面板返回。ADMIN403。
  /priorities/personal:
    get:
      summary: 读取本人的个人十大事项和版本
      security:
      - bearer: []
      responses:
        '200':
          description: 未保存过时 revision 为 0，items 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalPrioritySnapshot'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    put:
      summary: 按列表顺序保存本人的十大事项
      description: 所有权取自登录账号；不能引用他人的正 id。revision 必须是最近读取的版本，冲突返回 409；不会静默覆盖。新项 id 可缺省或为负数，响应返回稳定正 id。items 为空会清空列表。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalPriorityInput'
      responses:
        '200':
          description: 保存成功，返回新版本及服务器 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalPrioritySnapshot'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
  /company-notices:
    get:
      summary: 全员只读：启用的公司十大事项
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyNotice'
        '403':
          $ref: '#/components/responses/Error403'
  /company-notices/{id}:
    get:
      summary: 公司事项详情（含本人备注）
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '404':
          $ref: '#/components/responses/Error404'
  /company-notices/{id}/note:
    put:
      summary: 写本人备注（每人每条唯一，空字符串清空）
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
  /admin/company-notices:
    get:
      summary: 仅 ADMIN：全部事项（含停用）
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyNotice'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      summary: 仅 ADMIN：发布事项（启用上限 10）
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyNoticeInput'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '400':
          $ref: '#/components/responses/Error400'
  /admin/company-notices/{id}:
    patch:
      summary: 仅 ADMIN：修改内容、排序或状态
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyNoticeInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '400':
