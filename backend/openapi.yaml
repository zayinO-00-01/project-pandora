openapi: 3.0.3
info:
  title: Pandora API
  version: 0.3.0
  description: 本地日志与任务派发契约。登录、成员范围、日志、任务派发和责任人进度反馈；公司事项和个人十大事后续补充。
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      summary: 注册
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                displayName: { type: string }
      responses:
        "201":
          description: 已创建
        "400":
          description: 用户名已存在或字段不合法
  /auth/login:
    post:
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  role: { type: string, enum: [ADMIN, FOUNDER, DEPT_HEAD, TEAM_LEAD, LEADER, STAFF] }
                  displayName: { type: string }
                  userId: { type: integer }
        "401":
          description: 口令错误
  /logs/integrity:
    get:
      summary: 完整性校验历史占位（尚未校验实际完整性）
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 通过
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
        "401":
          description: 未登录
  /logs:
    get:
      summary: 本人可看草稿；领导按组织关系向下穿透；下级经直属上级批准可向上只读，任何他人草稿均不公开
      security: [{ bearer: [] }]
      parameters:
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: userId
          schema: { type: integer }
      responses:
        "200":
          description: 按时间倒序
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/WorkLog" }
        "403":
          description: 无权查看该用户
    post:
      summary: 新建七天前至今天的日志，省略 status 默认 submitted
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [logDate, content]
              properties:
                logDate: { type: string, format: date, description: "Asia/Shanghai 七天前至今天，两端包含" }
                content: { type: string, minLength: 1, maxLength: 5000 }
                status: { type: string, enum: [draft, submitted], default: submitted }
      responses:
        "201":
          description: 已保存，返回服务端分配的 ID 和时间
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "400":
          description: 日期不在七天前至今天范围、正文为空/超过5000字或状态不合法
  /health:
    get:
      summary: 无需登录的健康检查
      responses:
        "200": { description: 服务正常 }
  /users:
    get:
      summary: 本人及授权成员的公开资料，不含密码
      security: [{ bearer: [] }]
      responses:
        "200":
          description: STAFF 仅本人，LEADER 本人及直属下属，四级领导按组织关系向下穿透，ADMIN 全部
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "401": { description: 未登录 }
  /logs/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    put:
      summary: 作者修改日志；原日期及新日期均须在七天前至今天，已提交不能改回草稿
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogInput" }
      responses:
        "200":
          description: 修改后的同一篇日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "400": { description: 新日期不在可写范围、参数错误或尝试撤回已提交状态 }
        "401": { description: 未登录 }
        "403": { description: 不是日志作者或原日志日期已超出可修改范围 }
        "404": { description: 日志不存在 }
  /logs/{id}/submit:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      summary: 作者提交可写日期内的草稿；重复提交不重复创建，无需 body
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 已提交日志
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkLog" }
        "401": { description: 未登录 }
        "403": { description: 不是日志作者或原日志日期已超出可修改范围 }
        "404": { description: 日志不存在 }
  /panels/map:
    get:
      summary: 导图四板块
      security: [{ bearer: [] }]
      responses:
        "200":
          description: companyDispatch 返回当前授权范围最新十条任务，todayLogs 返回本人今日日志（Asia/Shanghai）；公司事项及个人十大事暂为空
          content:
            application/json:
              schema:
                type: object
                properties:
                  companyImportant:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  companyDispatch:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  personalTop:
                    type: array
                    maxItems: 10
                    items: { $ref: "#/components/schemas/PanelItem" }
                  todayLogs:
                    type: array
                    items: { $ref: "#/components/schemas/WorkLog" }
  /tasks:
    get:
      parameters:
        - in: query
          name: userId
          schema: { type: integer, format: int64 }
          description: 指定成员只读任务，按组织关系或直属上级批准状态鉴权
      summary: 当前授权范围的任务，按创建时间倒序
      description: ADMIN 可查看全部，LEADER 保留直属范围；四级领导可查看本人创建及组织关系下属负责的任务，STAFF 默认只看本人负责的任务。指定 userId 时验证向下关系或直属上级批准，只返回该成员负责的任务。
      security: [{ bearer: [] }]
      responses:
        "200":
          description: 任务列表
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Task" } }
        "401": { description: 未登录 }
    post:
      summary: 领导或管理员派发任务
      description: LEADER 只能派给直属 STAFF，四级领导可派给组织关系内较低层级下属；ADMIN 可派给其他非管理员成员。向上查看批准不授予派发或修改权限，员工不可派发。当前不支持邀约请示。
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskInput" }
      responses:
        "201":
          description: 已创建，进度 0，状态 todo
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { description: 名称/详情/优先级/责任人/时间格式不合法 }
        "401": { description: 未登录 }
        "403": { description: 无权派发或责任人不在可派发范围 }
        "404": { description: 责任人不存在 }
  /tasks/{id}/progress:
    put:
      summary: 当前责任人反馈进度
      description: 仅责任人可改；0 对应 todo，1到99 对应 doing，100 对应 done，允许纠正进度。创建人和管理员不能代改。
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskProgressInput" }
      responses:
        "200":
          description: 更新后的同一任务
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { description: 进度非整数/超出0到100或说明为空/超过2000字 }
        "401": { description: 未登录 }
        "403": { description: 不是当前责任人 }
        "404": { description: 任务不存在 }
  /users/organization:
    get:
      summary: 授权下属身份与直属上级身份，日志与任务通过独立接口鉴权
      security: [{ bearer: [] }]
      responses:
        "200":
          description: members 为组织关系内较低层级下属，manager 为直属上级或 null
  /view-requests:
    get:
      summary: 仅返回本人作为申请人或被查看者参与的申请
      security: [{ bearer: [] }]
      responses:
        "200": { description: 申请列表，含 requester、target 公开身份、reason、status、updatedAt }
    post:
      summary: 申请查看直属上级，待审批与已批准申请不可重复提交
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, reason]
              properties:
                targetId: { type: integer, format: int64 }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200": { description: 待审批申请 }
        "403": { description: 非直属上级或角色关系不符 }
        "409": { description: 已有申请或并发冲突 }
  /view-requests/{id}:
    put:
      summary: 被查看的直属上级批准、拒绝待审批申请，或撤销已批准授权
      security: [{ bearer: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, denied, revoked] }
      responses:
        "200": { description: 更新后的申请，批准只允许读取已提交日志与本人任务 }
        "403": { description: 非被查看者、非当前直属关系 }
        "409": { description: 申请状态变化或并发冲突 }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  schemas:
    LogInput:
      type: object
      required: [logDate, content]
      properties:
        logDate: { type: string, format: date, description: 不能晚于 Asia/Shanghai 时区的今天 }
        content: { type: string, minLength: 1, maxLength: 5000, description: 不能全部为空白 }
        status: { type: string, enum: [draft, submitted], description: PUT 省略时保留原状态 }
    UserSummary:
      type: object
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        displayName: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, FOUNDER, DEPT_HEAD, TEAM_LEAD, LEADER, STAFF] }
    WorkLog:
      type: object
      properties:
        id: { type: integer }
        userId: { type: integer }
        logDate: { type: string, format: date }
        content: { type: string }
        status: { type: string, enum: [draft, submitted] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PanelItem:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        sortOrder: { type: integer }
        myRemark: { type: string, description: 只影响当前用户 }
    TaskInput:
      type: object
      required: [title, assigneeId]
      properties:
        title: { type: string, minLength: 1, maxLength: 128, description: 不能全部为空白 }
        detail: { type: string, maxLength: 5000, nullable: true }
        priority: { type: string, enum: [low, normal, high], default: normal }
        dueAt: { type: string, format: date-time, nullable: true, description: ISO8601时间，可登记过去时间；页面按上海时区显示 }
        assigneeId: { type: integer, format: int64 }
    TaskProgressInput:
      type: object
      required: [progress, progressNote]
      properties:
        progress: { type: integer, minimum: 0, maximum: 100 }
        progressNote: { type: string, minLength: 1, maxLength: 2000, description: 不能全部为空白 }
    Task:
      type: object
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        detail: { type: string, nullable: true }
        priority: { type: string, enum: [low, normal, high] }
        status: { type: string, enum: [todo, doing, done] }
        dueAt: { type: string, format: date-time, nullable: true }
        progress: { type: integer, minimum: 0, maximum: 100 }
        progressNote: { type: string }
        createdBy: { type: integer, format: int64 }
        assigneeId: { type: integer, format: int64 }
        creatorName: { type: string }
        assigneeName: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
