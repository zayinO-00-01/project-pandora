openapi: 3.0.3
info:
  title: Pandora API
  version: 0.8.0
  description: 五角色整合原型。ADMIN维护账号、档案与公司事项；Android办理业务。自建任务由当前直属上级审核（创始人免审），领导向实际下级派发。保留个人清单同步、私密备注，增加任务生命周期审核、站内通知、标签、跨日日志和协作关键词。
servers:
- url: /api/v1
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /auth/login:
    post:
      summary: 登录，停用账号拒绝
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
  /admin/users:
    get:
      summary: 仅 ADMIN：账号列表
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
    post:
      summary: 仅 ADMIN：建号
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 用户名trim后唯一；上级必须为启用的更高业务角色。ADMIN/FOUNDER无上级。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
  /admin/users/{id}:
    patch:
      summary: 仅 ADMIN：修改账号、角色、组织与停用
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 防止层级错误和组织环。相关角色/上级/停用变化撤销pending/approved查看申请；重新启用不恢复授权。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUser'
  /users:
    get:
      summary: 业务账号可读成员，含本人
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: FOUNDER全公司启用业务成员；部门/团队领导实际下级树；STAFF仅本人。ADMIN403。
  /users/organization:
    get:
      summary: 业务组织与可派发责任人
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: members为可读成员且不含本人；manager为直属上级；assignees仅实际较低角色下级。FOUNDER全公司可读不代表均可派发。
  /logs:
    get:
      summary: 本人及授权目标日志
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 默认本人；历史不限日期。他人仅submitted，含获批直属上级只读。ADMIN403。
      parameters:
      - in: query
        name: userId
        schema:
          type: integer
          format: int64
      - in: query
        name: date
        schema:
          type: string
          format: date
    post:
      summary: 新建草稿/提交日志
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 单日或连续多日，起止均为上海今天及前三天；历史或跨日记录直接提交。只有单独今天的记录可再编辑/提交草稿。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
  /logs/{id}:
    put:
      summary: 作者编辑日志
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅作者当天单日记录可修改，日期范围创建后固定；历史及跨日记录只读，不能改日期绕过。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogInput'
  /logs/{id}/submit:
    post:
      summary: 作者提交原草稿
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkLog'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 旧记录超出窗口403；重复提交保持同ID。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
  /logs/integrity:
    get:
      summary: 日志能力探测
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integrity'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: supportsDateRanges用于客户端能力协商。完整性校验文案仍为占位返回，不代表已实现额外业务校验。
  /view-requests:
    get:
      summary: 本人发起或收到的申请
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
    post:
      summary: 申请查看直属上级
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 仅当前更高业务角色直属上级，理由非空；已有pending/approved返回409。拒绝或撤销后可重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewRequestInput'
  /view-requests/{id}:
    put:
      summary: 被查看者批准、拒绝或撤销
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewRequest'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: pending→approved/denied；approved→revoked。批准只可读目标submitted日志及其负责的任务，不含草稿或写入派发权。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ViewDecision'
  /tasks:
    get:
      summary: 授权范围任务
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 默认角色读范围，包含pending/rejected自主任务；指定userId读取其负责的任务（须有成员读权限）。FOUNDER全公司，部门/团队领导实际下级树，员工本人；ADMIN403。
      parameters:
      - in: query
        name: userId
        schema:
          type: integer
          format: int64
    post:
      summary: 创建自主任务或向实际下级派发
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 业务成员可给自己安排任务；非创始人的自建任务先进入pending，当前有效直属上级批准后执行。领导向实际下级派发直接生效。不能向不在授权范围的其他人派发。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
  /tasks/pending-approvals:
    get:
      summary: 当前直属下级提交的待审批自主任务
      description: 仅返回当前直属上级为登录用户、作者启用且职级低于审批人的pending自主任务。组织调整后由新的直属上级审批，原上级失去审批权；ADMIN403。
      security:
      - bearer: []
      responses:
        '200':
          description: 待审批任务，按创建时间和ID倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
  /tasks/{id}/approval:
    put:
      summary: 当前直属上级审批自主任务
      description: 仅当前直属且职级较高的业务上级可审批本人创建并负责的pending任务，禁止自批和越级代批。已审批任务返回409。只更新审批审计字段，不更改工作状态或进度。
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskApproval'
      responses:
        '200':
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/{id}/progress:
    put:
      summary: 仅责任人反馈进度
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 责任人反馈状态和说明；仅已批准的任务可执行。完成可能进入pending_done等待派发人验收，自建任务由当前直属上级验收，创始人自建直接完成。
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskProgress'
  /panels/map:
    get:
      summary: 业务首页四板块
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PanelMap'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
      security:
      - bearer: []
      description: 本人今日日志、当前可读最新10任务、已发布公司事项及本人十大事项；详情和本人备注随面板返回。ADMIN403。
  /priorities/personal:
    get:
      summary: 读取本人的个人十大事项和版本
      security:
      - bearer: []
      responses:
        '200':
          description: 未保存过时 revision 为 0，items 为空
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalPrioritySnapshot'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
    put:
      summary: 按列表顺序保存本人的十大事项
      description: 所有权取自登录账号；不能引用他人的正 id。revision 必须是最近读取的版本，冲突返回 409；不会静默覆盖。新项 id 可缺省或为负数，响应返回稳定正 id。items 为空会清空列表。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonalPriorityInput'
      responses:
        '200':
          description: 保存成功，返回新版本及服务器 id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonalPrioritySnapshot'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
  /company-notices:
    get:
      summary: 全员只读：启用的公司十大事项
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyNotice'
        '403':
          $ref: '#/components/responses/Error403'
  /company-notices/{id}:
    get:
      summary: 公司事项详情（含本人备注）
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '404':
          $ref: '#/components/responses/Error404'
  /company-notices/{id}/note:
    put:
      summary: 写本人备注（每人每条唯一，空字符串清空）
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
  /admin/company-notices:
    get:
      summary: 仅 ADMIN：全部事项（含停用）
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompanyNotice'
        '403':
          $ref: '#/components/responses/Error403'
    post:
      summary: 仅 ADMIN：发布事项（启用上限 10）
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyNoticeInput'
      responses:
        '201':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '400':
          $ref: '#/components/responses/Error400'
  /admin/company-notices/{id}:
    patch:
      summary: 仅 ADMIN：修改内容、排序或状态
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyNoticeInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyNotice'
        '400':
          $ref: '#/components/responses/Error400'
  /admin/company-notices/{id}/note:
    get:
      summary: 仅 ADMIN：读本人在该事项上的备注
      description: 业务端 /company-notices/{id}/note 会以 403 拒绝 ADMIN；管理员改用本端点维护自己的备注，停用事项同样可读。
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNote'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
    put:
      summary: 仅 ADMIN：写本人在该事项上的备注（每人每条唯一）
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminNote'
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
  /users/me:
    get:
      summary: 本人完整档案（含敏感字段）
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
  /tasks/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: 任务创建人提出内容变更
      description: 创建人提出内容变更，创始人直接生效；其他创建人的变更交上级审核，批准前保留有效内容。责任人保持不变。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
    delete:
      summary: 创建人提出删除或创始人直接删除
      description: 采用软删除。未开始任务按既有规则直接删除；已有执行进度时进入上级审核。
      security:
      - bearer: []
      responses:
        '204':
          description: 请求已处理；刷新任务或审核列表确认状态
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /task-reviews:
    get:
      summary: 本人提交或待本人审核的跨作者关键词修改申请
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KeywordReview'
      description: 仅用于KEYWORD_EDIT/KEYWORD_DELETE。任务自建审批走/tasks/pending-approvals，完成/内容变更/删除审核走/tasks/reviews。
  /task-reviews/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: 直属上级批准或拒绝；申请人可撤回
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - approved
                  - rejected
                  - canceled
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KeywordReview'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
      description: '{status:approved|rejected|canceled}。申请人可撤回；批准/拒绝仅当前有效直属上级可操作，不能自审或重复审批。'
  /labels:
    get:
      summary: 所有业务成员可读取启用标签
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Label'
    post:
      summary: 创始人新增标签
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
        '403':
          $ref: '#/components/responses/Error403'
  /labels/{id}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: 创始人更新标签名称及颜色，关联任务和日历同步反映
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelInput'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
    delete:
      summary: 创始人停用标签；历史关联保留
      security:
      - bearer: []
      responses:
        '200':
          description: 已停用
  /notifications:
    get:
      summary: 本人站内通知和未读数量
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationList'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /notifications/{id}/read:
    post:
      summary: 将本人通知标记已读
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      security:
      - bearer: []
      responses:
        '204':
          description: 已标记
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /profile:
    get:
      summary: 读取自己的资料及头像
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
  /profile/avatar:
    put:
      summary: 上传自己的头像或清空头像
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - avatarData
              properties:
                avatarData:
                  type: string
                  maxLength: 60000
                  description: PNG/JPEG data URL；解码后最大45KB、1024×1024；空串移除
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
  /profile/password:
    put:
      summary: 验证当前密码后修改自己的密码
      description: 新密码8至72字符，且UTF-8最多72字节；成功后旧会话全部失效。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - currentPassword
              - newPassword
              properties:
                currentPassword:
                  type: string
                  maxLength: 72
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 72
      responses:
        '200':
          description: 修改成功，客户端重新登录
  /tasks/{id}/keywords:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    post:
      summary: 任务创建人及执行人共同添加关键词
      description: 仅已生效任务，每任务最多12个词，每词1至24字，不允许重复或控制字符。有待审关键词变更时先处理该审核。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskKeywordInput'
      responses:
        '200':
          description: 关键词已添加
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/{id}/keywords/{keywordId}:
    parameters:
    - in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    - in: path
      name: keywordId
      required: true
      schema:
        type: integer
        format: int64
    put:
      summary: 修改关键词，修改他人词需直属上级审核
      description: 自己添加的词直接修改；创始人免审。其他修改保留原词直至直属上级批准，复用任务审核及通知。响应message说明是否已提交审核。
      security:
      - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskKeywordInput'
      responses:
        '200':
          description: 已更新或已提交直属上级审核
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
    delete:
      summary: 删除关键词，删除他人词需直属上级审核
      security:
      - bearer: []
      responses:
        '200':
          description: 已删除或已提交直属上级审核，批准前保留原词
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/reviews:
    get:
      summary: 待我验收、变更或删除审核的任务
      security:
      - bearer: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/{id}/approve:
    post:
      summary: 批准待审操作
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleReview'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /tasks/{id}/reject:
    post:
      summary: 驳回待审操作
      security:
      - bearer: []
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleReview'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
  /notifications/read-all:
    post:
      summary: 将本人全部通知标记已读
      security:
      - bearer: []
      responses:
        '204':
          description: 已标记
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          description: 必填，11 位手机号，trim 后唯一
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
      - username
      - password
      - role
      - phone
    PatchUser:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        clearManager:
          type: boolean
          description: true clears current managerId
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    Session:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          nullable: true
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          nullable: true
        managerId:
          type: integer
          format: int64
          nullable: true
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        managerName:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        avatarImage:
          type: string
          nullable: true
    CompanyNotice:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
        publisherId:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
        myNote:
          type: string
          nullable: true
    CompanyNoticeInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 128
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
      required:
      - title
      - content
    NoteInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
      required:
      - content
    AdminNote:
      type: object
      description: ADMIN 本人的事项备注；只返回调用者自己的备注，不含他人内容。
      properties:
        id:
          type: integer
          format: int64
        myNote:
          type: string
          nullable: true
    LogInput:
      type: object
      properties:
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 标签ID；更新时null保留原标签，0清除标签。创建时null不使用标签。
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
      required:
      - logDate
      - content
    WorkLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        label:
          $ref: '#/components/schemas/Label'
          nullable: true
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
    Organization:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        manager:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    ViewRequestInput:
      type: object
      properties:
        targetId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - targetId
      - reason
    ViewDecision:
      type: object
      properties:
        status:
          type: string
          enum:
          - approved
          - denied
          - revoked
      required:
      - status
    ViewRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requester:
          $ref: '#/components/schemas/UserSummary'
        target:
          $ref: '#/components/schemas/UserSummary'
        reason:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - denied
          - revoked
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ''
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 标签ID；更新时null保留原标签，0清除标签。创建时null不使用标签。
      required:
      - title
      - assigneeId
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ''
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - todo
          - doing
          - done
        progress:
          type: integer
          nullable: true
          description: 未填写时为null，不能显示为0%。
          minimum: 0
          maximum: 100
        progressNote:
          type: string
        createdBy:
          type: integer
          format: int64
        creatorName:
          type: string
        assigneeName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvalStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          description: 旧任务及下派任务默认approved，自主任务除FOUNDER外待直属上级审批。
        approvalNote:
          type: string
          maxLength: 500
          default: ''
        reviewerId:
          type: integer
          format: int64
          nullable: true
          description: 实际审批人；未人工审批时为null。
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/TaskKeyword'
        label:
          $ref: '#/components/schemas/Label'
          nullable: true
        reviewStatus:
          type: string
          enum:
          - none
          - pending_done
          - pending_change
          - pending_delete
          - approved
          - rejected
        reviewReason:
          type: string
          nullable: true
        reviewedBy:
          type: integer
          format: int64
          nullable: true
        lifecycleReviewedAt:
          type: string
          format: date-time
          nullable: true
        deleted:
          type: boolean
        pendingChange:
          type: string
          nullable: true
    TaskApproval:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        note:
          type: string
          maxLength: 500
          default: ''
          description: 选填，驳回也允许空说明。
    TaskProgress:
      type: object
      description: 责任人反馈状态和说明；仅已批准的任务可执行。完成可能进入pending_done等待派发人验收，自建任务由当前直属上级验收，创始人自建直接完成。
      properties:
        status:
          type: string
          enum:
          - todo
          - doing
          - done
          description: 独立工作状态；与所填百分比不一致时返回400，不更改原记录。
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 选填严格整数；todo仅0，doing为0..99，done仅100；字符串和小数拒绝。
        progressNote:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - progressNote
      anyOf:
      - required:
        - status
      - required:
        - progress
        properties:
          progress:
            type: integer
            nullable: false
            minimum: 0
            maximum: 100
    PersonalPriorityInput:
      type: object
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required:
            - title
            properties:
              id:
                type: integer
                format: int64
                nullable: true
              title:
                type: string
                minLength: 1
                maxLength: 120
              detail:
                type: string
                maxLength: 2000
                nullable: true
              sortOrder:
                type: integer
                description: 服务端按数组位置规范化为 0 开始的顺序
    PersonalPrioritySnapshot:
      type: object
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PanelItem'
    PanelItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        sortOrder:
          type: integer
        myRemark:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
    PanelMap:
      type: object
      properties:
        companyImportant:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
        companyDispatch:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
          maxItems: 10
        personalTop:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
        todayLogs:
          type: array
          items:
            $ref: '#/components/schemas/WorkLog'
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    Integrity:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        supportsDateRanges:
          type: boolean
          description: True when the server supports inclusive endDate on work logs.
    TaskKeywordInput:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 24
    TaskKeyword:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
          maxLength: 24
        createdBy:
          type: integer
          format: int64
    LabelInput:
      type: object
      required:
      - name
      - color
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
    WorkLabel:
      allOf:
      - $ref: '#/components/schemas/LabelInput'
      - type: object
        properties:
          id:
            type: integer
            format: int64
          active:
            type: boolean
    LifecycleReview:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
    AppNotification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        title:
          type: string
        body:
          type: string
        taskId:
          type: integer
          format: int64
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppNotification'
        unreadCount:
          type: integer
          format: int64
    Label:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        active:
          type: boolean
    KeywordReview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        taskTitle:
          type: string
        applicantId:
          type: integer
          format: int64
        applicantName:
          type: string
        reviewerId:
          type: integer
          format: int64
        reviewerName:
          type: string
        operation:
          type: string
          enum:
          - KEYWORD_EDIT
          - KEYWORD_DELETE
        payload:
          type: string
          description: JSON字符串，含原词、拟议词或删除操作
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - canceled
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
    AccountProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        avatarData:
          type: string
          nullable: true
  responses:
    Error400:
      description: 参数错误（含重复用户名）；无效新建/目标日期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 未登录或账号停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 角色/范围无权，或原日志已超出编辑窗口
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 记录不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 申请重复、状态已变化或并发冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
