components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          description: 必填，11 位手机号，trim 后唯一
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
      - username
      - password
      - role
      - phone
    PatchUser:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        clearManager:
          type: boolean
          description: true clears current managerId
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
    Session:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          nullable: true
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - FOUNDER
          - DEPT_HEAD
          - TEAM_LEAD
          - STAFF
        displayName:
          type: string
          nullable: true
        managerId:
          type: integer
          format: int64
          nullable: true
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum:
          - MALE
          - FEMALE
          - UNSPECIFIED
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        managerName:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        avatarImage:
          type: string
          nullable: true
    CompanyNotice:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
        publisherId:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
        myNote:
          type: string
          nullable: true
    CompanyNoticeInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 128
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
      required:
      - title
      - content
    NoteInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
      required:
      - content
    AdminNote:
      type: object
      description: ADMIN 本人的事项备注；只返回调用者自己的备注，不含他人内容。
      properties:
        id:
          type: integer
          format: int64
        myNote:
          type: string
          nullable: true
    LogInput:
      type: object
      properties:
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 标签ID；更新时null保留原标签，0清除标签。创建时null不使用标签。
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
      required:
      - logDate
      - content
    WorkLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
          - draft
          - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        label:
          $ref: '#/components/schemas/Label'
          nullable: true
        endDate:
          type: string
          format: date
          description: Inclusive end; defaults to logDate; both endpoints within today-3..today.
    Organization:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
        manager:
          allOf:
          - $ref: '#/components/schemas/UserSummary'
          nullable: true
        assignees:
          type: array
          items:
            $ref: '#/components/schemas/UserSummary'
    ViewRequestInput:
      type: object
      properties:
        targetId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - targetId
      - reason
    ViewDecision:
      type: object
      properties:
        status:
          type: string
          enum:
          - approved
          - denied
          - revoked
      required:
      - status
    ViewRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requester:
          $ref: '#/components/schemas/UserSummary'
        target:
          $ref: '#/components/schemas/UserSummary'
        reason:
          type: string
        status:
          type: string
          enum:
          - pending
          - approved
          - denied
          - revoked
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ''
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        labelId:
          type: integer
          format: int64
          nullable: true
          description: 标签ID；更新时null保留原标签，0清除标签。创建时null不使用标签。
      required:
      - title
      - assigneeId
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ''
        priority:
          type: string
          enum:
          - low
          - normal
          - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - todo
          - doing
          - done
        progress:
          type: integer
          nullable: true
          description: 未填写时为null，不能显示为0%。
          minimum: 0
          maximum: 100
        progressNote:
          type: string
        createdBy:
          type: integer
          format: int64
        creatorName:
          type: string
        assigneeName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvalStatus:
          type: string
          enum:
          - pending
          - approved
          - rejected
          description: 旧任务及下派任务默认approved，自主任务除FOUNDER外待直属上级审批。
        approvalNote:
          type: string
          maxLength: 500
          default: ''
        reviewerId:
          type: integer
          format: int64
          nullable: true
          description: 实际审批人；未人工审批时为null。
        reviewedAt:
          type: string
          format: date-time
          nullable: true
        keywords:
          type: array
          items:
            $ref: '#/components/schemas/TaskKeyword'
        label:
          $ref: '#/components/schemas/Label'
          nullable: true
        reviewStatus:
          type: string
          enum:
          - none
          - pending_done
          - pending_change
          - pending_delete
          - approved
          - rejected
        reviewReason:
          type: string
          nullable: true
        reviewedBy:
          type: integer
          format: int64
          nullable: true
        lifecycleReviewedAt:
          type: string
          format: date-time
          nullable: true
        deleted:
          type: boolean
        pendingChange:
          type: string
          nullable: true
    TaskApproval:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          enum:
          - approved
          - rejected
        note:
          type: string
          maxLength: 500
          default: ''
          description: 选填，驳回也允许空说明。
    TaskProgress:
      type: object
      description: 仅责任人提交。非创始人提交todo/doing/done均生成PROGRESS审核，当前有效直属上级批准前保持旧状态与说明；仅创始人本人作为责任人操作直接生效。
      properties:
        status:
          type: string
          enum:
          - todo
          - doing
          - done
          description: 独立工作状态；与所填百分比不一致时返回400，不更改原记录。
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 选填严格整数；todo仅0，doing为0..99，done仅100；字符串和小数拒绝。
        progressNote:
          type: string
          minLength: 1
          maxLength: 2000
      required:
      - progressNote
      anyOf:
      - required:
        - status
      - required:
        - progress
        properties:
          progress:
            type: integer
            nullable: false
            minimum: 0
            maximum: 100
    PersonalPriorityInput:
      type: object
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required:
            - title
            properties:
              id:
                type: integer
                format: int64
                nullable: true
              title:
                type: string
                minLength: 1
                maxLength: 120
              detail:
                type: string
                maxLength: 2000
                nullable: true
              sortOrder:
                type: integer
                description: 服务端按数组位置规范化为 0 开始的顺序
    PersonalPrioritySnapshot:
      type: object
      required:
      - revision
      - items
      properties:
        revision:
          type: integer
          format: int64
        items:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/PanelItem'
    PanelItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        sortOrder:
          type: integer
        myRemark:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
    PanelMap:
      type: object
      properties:
        companyImportant:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
        companyDispatch:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
          maxItems: 10
        personalTop:
          type: array
          items:
            $ref: '#/components/schemas/PanelItem'
        todayLogs:
          type: array
          items:
            $ref: '#/components/schemas/WorkLog'
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    Integrity:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
        supportsDateRanges:
          type: boolean
          description: True when the server supports inclusive endDate on work logs.
    TaskKeywordInput:
      type: object
      required:
      - text
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 24
    TaskKeyword:
      type: object
      properties:
        id:
          type: integer
          format: int64
        text:
          type: string
          maxLength: 24
        createdBy:
          type: integer
          format: int64
    LabelInput:
      type: object
      required:
      - name
      - color
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
    WorkLabel:
      allOf:
      - $ref: '#/components/schemas/LabelInput'
      - type: object
        properties:
          id:
            type: integer
            format: int64
          active:
            type: boolean
    LifecycleReview:
      type: object
      properties:
        note:
          type: string
          maxLength: 500
    AppNotification:
      type: object
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
        title:
          type: string
        body:
          type: string
        taskId:
          type: integer
          format: int64
          nullable: true
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
    NotificationList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AppNotification'
        unreadCount:
          type: integer
          format: int64
    Label:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        color:
          type: string
          pattern: ^#[0-9A-Fa-f]{6}$
        active:
          type: boolean
    KeywordReview:
      type: object
      properties:
        id:
          type: integer
          format: int64
        taskId:
          type: integer
          format: int64
        taskTitle:
          type: string
        applicantId:
          type: integer
          format: int64
        applicantName:
          type: string
        reviewerId:
          type: integer
          format: int64
          nullable: true
          description: 待审时使用申请人当前有效直属上级；无有效上级为null，旧审核人不能决定。
        reviewerName:
          type: string
        operation:
          type: string
          enum:
          - PROGRESS
          - KEYWORD_EDIT
          - KEYWORD_DELETE
        payload:
          type: string
          description: JSON字符串；PROGRESS含拟议status/progressNote，可选progress；关键词含原词/新词及操作。
        status:
          type: string
          enum:
          - pending
          - approved
          - rejected
          - canceled
        createdAt:
          type: string
          format: date-time
        decidedAt:
          type: string
          format: date-time
          nullable: true
      description: 通用进度或关键词审核；沿用此schema名称以兼容已记录契约。
    AccountProfile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        avatarData:
          type: string
          nullable: true
  responses:
    Error400:
      description: 参数错误（含重复用户名）；无效新建/目标日期
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: 未登录或账号停用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: 角色/范围无权，或原日志已超出编辑窗口
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: 记录不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 申请重复、状态已变化或并发冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
