openapi: 3.0.3
info:
  title: Pandora API
  version: 0.6.0
  description: 五角色本地原型。Web 仅 ADMIN：账号管理、档案维护与公司十大事项发布；Android 四业务角色。公开注册关闭；公司事项全员只读并可写个人备注。业务账号新增手机号（必填唯一）、身份证号、出生年月等档案字段。
servers:
  - url: /api/v1
paths:
  /health:
    get:
      summary: 健康检查
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /auth/login:
    post:
      summary: 登录，停用账号拒绝
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
  /admin/users:
    get:
      summary: 仅 ADMIN：账号列表
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
    post:
      summary: 仅 ADMIN：建号
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 用户名trim后唯一；上级必须为启用的更高业务角色。ADMIN/FOUNDER无上级。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
  /admin/users/{id}:
    patch:
      summary: 仅 ADMIN：修改账号、角色、组织与停用
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 防止层级错误和组织环。相关角色/上级/停用变化撤销pending/approved查看申请；重新启用不恢复授权。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUser"
  /users:
    get:
      summary: 业务账号可读成员，含本人
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: FOUNDER全公司启用业务成员；部门/团队领导实际下级树；STAFF仅本人。ADMIN403。
  /users/organization:
    get:
      summary: 业务组织与可派发责任人
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: members为可读成员且不含本人；manager为直属上级；assignees仅实际较低角色下级。FOUNDER全公司可读不代表均可派发。
  /logs:
    get:
      summary: 本人及授权目标日志
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 默认本人；历史不限日期。他人仅submitted，含获批直属上级只读。ADMIN403。
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
        - in: query
          name: date
          schema:
            type: string
            format: date
    post:
      summary: 新建草稿/提交日志
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 仅上海today-7..today两端包含的8日期；非法新建日期400。作者来自当前身份。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInput"
  /logs/{id}:
    put:
      summary: 作者编辑日志
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 原日期必须仍可编辑，否则403；目标日期非法400。已提交不可回草稿，保持同ID。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogInput"
  /logs/{id}/submit:
    post:
      summary: 作者提交原草稿
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkLog"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 旧记录超出窗口403；重复提交保持同ID。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
  /logs/integrity:
    get:
      summary: 历史占位接口，无真实完整性校验
      deprecated: true
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Integrity"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
  /view-requests:
    get:
      summary: 本人发起或收到的申请
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
    post:
      summary: 申请查看直属上级
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 仅当前更高业务角色直属上级，理由非空；已有pending/approved返回409。拒绝或撤销后可重新申请。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewRequestInput"
  /view-requests/{id}:
    put:
      summary: 被查看者批准、拒绝或撤销
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewRequest"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: pending→approved/denied；approved→revoked。批准只可读目标submitted日志及其负责的任务，不含草稿或写入派发权。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewDecision"
  /tasks:
    get:
      summary: 授权范围任务
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 默认角色读范围，包含pending/rejected自主任务；指定userId读取其负责的任务（须有成员读权限）。FOUNDER全公司，部门/团队领导实际下级树，员工本人；ADMIN403。
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
            format: int64
    post:
      summary: 创建自主任务或向实际下级派发
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 四个业务角色均可创建本人负责的自主任务；除FOUNDER立即approved外，需有效且启用的较高职级直属上级，创建为pending，无有效上级返回400。业务领导向实际下级派发仍立即approved；STAFF不得派发他人，ADMIN403。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
  /tasks/pending-approvals:
    get:
      summary: 当前直属下级提交的待审批自主任务
      description: 仅返回当前直属上级为登录用户、作者启用且职级低于审批人的pending自主任务。组织调整后由新的直属上级审批，原上级失去审批权；ADMIN403。
      security:
        - bearer: []
      responses:
        "200":
          description: 待审批任务，按创建时间和ID倒序
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
  /tasks/{id}/approval:
    put:
      summary: 当前直属上级审批自主任务
      description: 仅当前直属且职级较高的业务上级可审批本人创建并负责的pending任务，禁止自批和越级代批。已审批任务返回409。只更新审批审计字段，不更改工作状态或进度。
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskApproval"
      responses:
        "200":
          description: 更新后的任务
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /tasks/{id}/progress:
    put:
      summary: 仅责任人反馈进度
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 仅approvalStatus为approved的任务可反馈；pending/rejected返回409且不修改任务。独立保存status(todo/doing/done)，progress选填可null；填值时todo仅0、doing为0..99、done仅100。说明非空最多2000字。旧请求仅缺status且有整数progress时兼容推导。查看批准不授予反馈权限。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskProgress"
  /panels/map:
    get:
      summary: 业务首页四板块
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PanelMap"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      security:
        - bearer: []
      description: 本人今日日志、当前可读最新10任务、已发布公司事项及本人十大事项；详情和本人备注随面板返回。ADMIN403。
  /priorities/personal:
    get:
      summary: 读取本人的个人十大事项和版本
      security:
        - bearer: []
      responses:
        "200":
          description: 未保存过时 revision 为 0，items 为空
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalPrioritySnapshot"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
    put:
      summary: 按列表顺序保存本人的十大事项
      description: 所有权取自登录账号；不能引用他人的正 id。revision 必须是最近读取的版本，冲突返回 409；不会静默覆盖。新项 id 可缺省或为负数，响应返回稳定正 id。items 为空会清空列表。
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalPriorityInput"
      responses:
        "200":
          description: 保存成功，返回新版本及服务器 id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalPrioritySnapshot"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "409":
          $ref: "#/components/responses/Error409"
  /company-notices:
    get:
      summary: 全员只读：启用的公司十大事项
      security:
        - bearer: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyNotice"
        "403":
          $ref: "#/components/responses/Error403"
  /company-notices/{id}:
    get:
      summary: 公司事项详情（含本人备注）
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyNotice"
        "404":
          $ref: "#/components/responses/Error404"
  /company-notices/{id}/note:
    put:
      summary: 写本人备注（每人每条唯一，空字符串清空）
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteInput"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyNotice"
  /admin/company-notices:
    get:
      summary: 仅 ADMIN：全部事项（含停用）
      security:
        - bearer: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyNotice"
        "403":
          $ref: "#/components/responses/Error403"
    post:
      summary: 仅 ADMIN：发布事项（启用上限 10）
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyNoticeInput"
      responses:
        "201":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyNotice"
        "400":
          $ref: "#/components/responses/Error400"
  /admin/company-notices/{id}:
    patch:
      summary: 仅 ADMIN：修改内容、排序或状态
      security:
        - bearer: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyNoticeInput"
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyNotice"
        "400":
          $ref: "#/components/responses/Error400"
  /users/me:
    get:
      summary: 本人完整档案（含敏感字段）
      security:
        - bearer: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
    AdminUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        displayName:
          type: string
          nullable: true
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, UNSPECIFIED]
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    CreateUser:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 64
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        phone:
          type: string
          description: 必填，11 位手机号，trim 后唯一
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, UNSPECIFIED]
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
      required:
        - username
        - password
        - role
        - phone
    PatchUser:
      type: object
      properties:
        password:
          type: string
          minLength: 6
          maxLength: 72
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          maxLength: 64
        managerId:
          type: integer
          format: int64
          nullable: true
        disabled:
          type: boolean
        clearManager:
          type: boolean
          description: true clears current managerId
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, UNSPECIFIED]
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    Login:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password
    Session:
      type: object
      properties:
        token:
          type: string
        userId:
          type: integer
          format: int64
        role:
          type: string
          enum:
            - ADMIN
            - FOUNDER
            - DEPT_HEAD
            - TEAM_LEAD
            - STAFF
        displayName:
          type: string
          nullable: true
    Profile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        role:
          type: string
          enum: [ADMIN, FOUNDER, DEPT_HEAD, TEAM_LEAD, STAFF]
        displayName:
          type: string
          nullable: true
        managerId:
          type: integer
          format: int64
          nullable: true
        phone:
          type: string
          nullable: true
        idCard:
          type: string
          nullable: true
        birthDate:
          type: string
          format: date
          nullable: true
        gender:
          type: string
          enum: [MALE, FEMALE, UNSPECIFIED]
          nullable: true
        hireDate:
          type: string
          format: date
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        emergencyPhone:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
    CompanyNotice:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
        publisherId:
          type: integer
          format: int64
          nullable: true
        updatedAt:
          type: string
        myNote:
          type: string
          nullable: true
    CompanyNoticeInput:
      type: object
      properties:
        title:
          type: string
          maxLength: 128
        content:
          type: string
        sortOrder:
          type: integer
        enabled:
          type: boolean
      required:
        - title
        - content
    NoteInput:
      type: object
      properties:
        content:
          type: string
          maxLength: 2000
      required:
        - content
    LogInput:
      type: object
      properties:
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
      required:
        - logDate
        - content
    WorkLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        logDate:
          type: string
          format: date
          description: 上海日期今天及前三天可新建；修改和提交仅限今天。历史日期只读。
        content:
          type: string
          minLength: 1
          maxLength: 5000
        status:
          type: string
          enum:
            - draft
            - submitted
          description: POST omitted defaults submitted; PUT omitted retains status
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Organization:
      type: object
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
        manager:
          allOf:
            - $ref: "#/components/schemas/UserSummary"
          nullable: true
        assignees:
          type: array
          items:
            $ref: "#/components/schemas/UserSummary"
    ViewRequestInput:
      type: object
      properties:
        targetId:
          type: integer
          format: int64
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
        - targetId
        - reason
    ViewDecision:
      type: object
      properties:
        status:
          type: string
          enum:
            - approved
            - denied
            - revoked
      required:
        - status
    ViewRequest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        requester:
          $ref: "#/components/schemas/UserSummary"
        target:
          $ref: "#/components/schemas/UserSummary"
        reason:
          type: string
        status:
          type: string
          enum:
            - pending
            - approved
            - denied
            - revoked
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ""
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
      required:
        - title
        - assigneeId
    Task:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          minLength: 1
          maxLength: 128
        detail:
          type: string
          maxLength: 5000
          default: ""
        priority:
          type: string
          enum:
            - low
            - normal
            - high
          default: normal
        assigneeId:
          type: integer
          format: int64
        dueAt:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
            - todo
            - doing
            - done
        progress:
          type: integer
          nullable: true
          description: 未填写时为null，不能显示为0%。
          minimum: 0
          maximum: 100
        progressNote:
          type: string
        createdBy:
          type: integer
          format: int64
        creatorName:
          type: string
        assigneeName:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        approvalStatus:
          type: string
          enum: [pending, approved, rejected]
          description: 旧任务及下派任务默认approved，自主任务除FOUNDER外待直属上级审批。
        approvalNote:
          type: string
          maxLength: 500
          default: ""
        reviewerId:
          type: integer
          format: int64
          nullable: true
          description: 实际审批人；未人工审批时为null。
        reviewedAt:
          type: string
          format: date-time
          nullable: true
    TaskApproval:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approved, rejected]
        note:
          type: string
          maxLength: 500
          default: ""
          description: 选填，驳回也允许空说明。
    TaskProgress:
      type: object
      description: 新客户端必须明确status；progress可省略或null，不把未知进度当成0。旧客户端仅提交整数progress仍临时兼容。
      properties:
        status:
          type: string
          enum: [todo, doing, done]
          description: 独立工作状态；与所填百分比不一致时返回400，不更改原记录。
        progress:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: 选填严格整数；todo仅0，doing为0..99，done仅100；字符串和小数拒绝。
        progressNote:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - progressNote
      anyOf:
        - required: [status]
        - required: [progress]
          properties:
            progress:
              type: integer
              nullable: false
              minimum: 0
              maximum: 100
    PersonalPriorityInput:
      type: object
      required: [revision, items]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          maxItems: 10
          items:
            type: object
            required: [title]
            properties:
              id:
                type: integer
                format: int64
                nullable: true
              title:
                type: string
                minLength: 1
                maxLength: 120
              detail:
                type: string
                maxLength: 2000
                nullable: true
              sortOrder:
                type: integer
                description: 服务端按数组位置规范化为 0 开始的顺序
    PersonalPrioritySnapshot:
      type: object
      required: [revision, items]
      properties:
        revision:
          type: integer
          format: int64
        items:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/PanelItem"
    PanelItem:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        sortOrder:
          type: integer
        myRemark:
          type: string
          nullable: true
        detail:
          type: string
          nullable: true
    PanelMap:
      type: object
      properties:
        companyImportant:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
        companyDispatch:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
          maxItems: 10
        personalTop:
          type: array
          items:
            $ref: "#/components/schemas/PanelItem"
        todayLogs:
          type: array
          items:
            $ref: "#/components/schemas/WorkLog"
    Error:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
    Integrity:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
  responses:
    Error400:
      description: 参数错误（含重复用户名）；无效新建/目标日期
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error401:
      description: 未登录或账号停用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error403:
      description: 角色/范围无权，或原日志已超出编辑窗口
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error404:
      description: 记录不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error409:
      description: 申请重复、状态已变化或并发冲突
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
