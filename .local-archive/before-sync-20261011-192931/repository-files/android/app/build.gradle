plugins { id 'com.android.application' }

android { namespace 'com.pandora.work'; compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'com.pandora.work'; minSdk 24; targetSdk 35; versionCode 1; versionName '0.1.0'
        buildConfigField 'String', 'API_BASE_URL', '"' + (project.findProperty('pandoraApiBaseUrl') ?: 'https://<domain>/api/v1') + '"'
    }
}
